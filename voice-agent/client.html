<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #202020,
                    #0d0d0d 55%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container {

            width: min(720px, 92vw);

            padding: 40px;

            background: rgba(30, 30, 30, 0.92);

            border: 1px solid #333;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.45);

            text-align: center;
        }


        h1 {

            margin-top: 0;

            font-size: 32px;
        }


        #status {

            margin: 15px 0 25px;

            color: #aaa;

            font-size: 17px;
        }


        /* =========================
           RECORDING INDICATOR
           ========================= */

        .recording {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;
        }


        #recordDot {

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #555;
        }


        #recordDot.active {

            background: #ff3333;

            box-shadow:
                0 0 15px #ff3333;

            animation:
                pulse 1s infinite;
        }


        @keyframes pulse {

            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: .5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        #timer {

            font-variant-numeric: tabular-nums;

            color: #aaa;
        }


        /* =========================
           BUTTONS
           ========================= */

        button {

            width: 220px;

            padding: 16px 25px;

            margin: 5px;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            transition: .15s;
        }


        button:hover {

            transform: translateY(-2px);
        }


        #start {

            background: white;

            color: black;
        }


        #stop {

            background: #d32f2f;

            color: white;

            display: none;
        }


        button:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           MIC LEVEL
           ========================= */

        .meter-container {

            margin-top: 25px;

            text-align: left;
        }


        .meter-label {

            font-size: 13px;

            color: #999;

            margin-bottom: 7px;
        }


        .meter {

            height: 10px;

            background: #222;

            border-radius: 10px;

            overflow: hidden;

            border: 1px solid #333;
        }


        #meterLevel {

            height: 100%;

            width: 0%;

            background: #4caf50;

            transition:
                width .05s linear;
        }


        /* =========================
           LOG
           ========================= */

        #log {

            margin-top: 30px;

            padding: 18px;

            height: 220px;

            overflow-y: auto;

            background: #111;

            border: 1px solid #292929;

            border-radius: 12px;

            text-align: left;

            font-family:
                Consolas,
                monospace;

            font-size: 13px;

            line-height: 1.6;

            white-space: pre-wrap;
        }


        .log-success {
            color: #66bb6a;
        }


        .log-error {
            color: #ef5350;
        }


        .log-info {
            color: #aaa;
        }


        audio {

            width: 100%;

            margin-top: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎤 Voice Agent</h1>


    <div id="status">
        Ready
    </div>


    <div class="recording">

        <div id="recordDot"></div>

        <span id="recordText">
            Microphone off
        </span>

        <span id="timer">
            00:00
        </span>

    </div>


    <button id="start">
        🎤 Start Recording
    </button>


    <button id="stop">
        ⏹ Stop
    </button>


    <div class="meter-container">

        <div class="meter-label">
            Microphone level
        </div>

        <div class="meter">

            <div id="meterLevel"></div>

        </div>

    </div>


    <div id="log"></div>

</div>


<script>

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");

const log =
    document.getElementById("log");

const recordDot =
    document.getElementById("recordDot");

const recordText =
    document.getElementById("recordText");

const timerElement =
    document.getElementById("timer");

const meterLevel =
    document.getElementById("meterLevel");


let pc = null;

let localStream = null;

let remoteAudio = null;

let audioContext = null;

let analyser = null;

let animationFrame = null;

let startTime = null;

let timerInterval = null;


/* =========================================================
   LOGGING
   ========================================================= */

function writeLog(message, type = "info") {

    console.log(message);

    const line =
        document.createElement("div");

    line.textContent =
        message;

    line.className =
        "log-" + type;

    log.appendChild(line);

    log.scrollTop =
        log.scrollHeight;
}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer() {

    startTime = Date.now();

    timerInterval =
        setInterval(() => {

            const elapsed =
                Math.floor(
                    (Date.now() - startTime) / 1000
                );

            const minutes =
                String(
                    Math.floor(elapsed / 60)
                ).padStart(2, "0");

            const seconds =
                String(
                    elapsed % 60
                ).padStart(2, "0");

            timerElement.textContent =
                `${minutes}:${seconds}`;

        }, 250);
}


function stopTimer() {

    if (timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;
    }

    timerElement.textContent =
        "00:00";
}


/* =========================================================
   MICROPHONE LEVEL METER
   ========================================================= */

async function startMicMeter(stream) {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const source =
            audioContext.createMediaStreamSource(
                stream
            );

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 1024;

        source.connect(analyser);

        const data =
            new Uint8Array(
                analyser.fftSize
            );


        function updateMeter() {

            if (!analyser) {
                return;
            }

            analyser.getByteTimeDomainData(
                data
            );


            let sum = 0;

            for (let i = 0; i < data.length; i++) {

                const value =
                    (data[i] - 128) / 128;

                sum += value * value;
            }


            const rms =
                Math.sqrt(
                    sum / data.length
                );


            /*
             * Convert RMS to a visible percentage.
             *
             * This is ONLY a browser-side visual meter.
             * It does not affect the audio sent to WebRTC.
             */

            const level =
                Math.min(
                    100,
                    rms * 350
                );


            meterLevel.style.width =
                level + "%";


            animationFrame =
                requestAnimationFrame(
                    updateMeter
                );
        }


        updateMeter();

        writeLog(
            "🎚 Microphone level meter started"
        );

    } catch (error) {

        writeLog(
            "Mic meter error: " +
            error.message,
            "error"
        );
    }
}


function stopMicMeter() {

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    meterLevel.style.width =
        "0%";


    if (audioContext) {

        audioContext.close();

        audioContext = null;
    }

    analyser = null;
}


/* =========================================================
   ICE
   ========================================================= */

function waitForIceGathering() {

    return new Promise(resolve => {

        if (!pc) {

            resolve();

            return;
        }


        if (
            pc.iceGatheringState ===
            "complete"
        ) {

            resolve();

            return;
        }


        function checkState() {

            if (
                pc.iceGatheringState ===
                "complete"
            ) {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    checkState
                );

                resolve();
            }
        }


        pc.addEventListener(
            "icegatheringstatechange",
            checkState
        );


        /*
         * Safety timeout.
         *
         * Normally ICE completes almost immediately
         * on localhost.
         */

        setTimeout(() => {

            pc?.removeEventListener(
                "icegatheringstatechange",
                checkState
            );

            resolve();

        }, 5000);

    });
}


/* =========================================================
   START
   ========================================================= */

async function startVoiceAgent() {

    if (pc) {

        writeLog(
            "Already connected.",
            "error"
        );

        return;
    }


    try {

        startButton.style.display =
            "none";

        stopButton.style.display =
            "inline-block";


        status.textContent =
            "Requesting microphone...";


        writeLog(
            "=================================================="
        );

        writeLog(
            "Starting voice agent..."
        );


        /* =====================================================
           MICROPHONE

           IMPORTANT:
           Do NOT force stereo.

           We allow the browser to choose the native microphone
           format. The server's frame_to_float32() handles the
           actual aiortc decoded stereo/packed frame correctly.
           ===================================================== */

        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio: {

                    echoCancellation: true,

                    noiseSuppression: true,

                    autoGainControl: false,

                    /*
                     * Do not force channelCount: 2.
                     */

                    sampleRate: 48000

                }

            });


        writeLog(
            "🎤 Microphone permission granted.",
            "success"
        );


        const micTracks =
            localStream.getAudioTracks();


        if (micTracks.length === 0) {

            throw new Error(
                "No microphone audio track found."
            );
        }


        const micTrack =
            micTracks[0];


        writeLog(
            "🎤 Track: " +
            micTrack.label
        );


        writeLog(
            "🎤 Track state: " +
            micTrack.readyState
        );


        /*
         * Show the actual browser settings.
         */

        try {

            const settings =
                micTrack.getSettings();

            writeLog(
                "🎤 Mic settings: " +
                JSON.stringify(
                    settings
                )
            );

        } catch (_) {}


        await startMicMeter(
            localStream
        );


        /* =====================================================
           PEER CONNECTION
           ===================================================== */

        pc =
            new RTCPeerConnection({

                /*
                 * Localhost does not need STUN.
                 *
                 * This keeps the connection simple.
                 */

                iceServers: []

            });


        pc.onconnectionstatechange =
            () => {

                if (!pc) {
                    return;
                }


                writeLog(
                    "Connection: " +
                    pc.connectionState
                );


                if (
                    pc.connectionState ===
                    "connected"
                ) {

                    status.textContent =
                        "🟢 Listening — speak now";

                    recordDot.classList.add(
                        "active"
                    );

                    recordText.textContent =
                        "Microphone active";

                    startTimer();

                    writeLog(
                        "🟢 WebRTC connected.",
                        "success"
                    );
                }


                if (
                    pc.connectionState ===
                    "failed"
                ) {

                    status.textContent =
                        "❌ Connection failed";

                    writeLog(
                        "WebRTC connection failed.",
                        "error"
                    );
                }


                if (
                    pc.connectionState ===
                    "disconnected"
                ) {

                    writeLog(
                        "⚠ WebRTC disconnected.",
                        "error"
                    );
                }
            };


        pc.oniceconnectionstatechange =
            () => {

                if (!pc) {
                    return;
                }

                writeLog(
                    "ICE: " +
                    pc.iceConnectionState
                );
            };


        pc.onicegatheringstatechange =
            () => {

                writeLog(
                    "ICE gathering: " +
                    pc.iceGatheringState
                );
            };


        /* =====================================================
           BROWSER -> SERVER MICROPHONE
           ===================================================== */

        pc.addTrack(
            micTrack,
            localStream
        );


        writeLog(
            "🎤 Microphone track attached."
        );


        /* =====================================================
           SERVER -> BROWSER AUDIO
           ===================================================== */

        pc.addTransceiver(
            "audio",
            {
                direction: "recvonly"
            }
        );


        pc.ontrack =
            event => {

                writeLog(
                    "🔊 Audio track received from server.",
                    "success"
                );


                if (
                    event.track.kind !==
                    "audio"
                ) {

                    return;
                }


                /*
                 * Reuse one audio element.
                 * Do not create a new element for every
                 * server response.
                 */

                if (!remoteAudio) {

                    remoteAudio =
                        document.createElement(
                            "audio"
                        );

                    remoteAudio.autoplay =
                        true;

                    remoteAudio.controls =
                        true;

                    remoteAudio.style.display =
                        "block";

                    document
                        .querySelector(
                            ".container"
                        )
                        .appendChild(
                            remoteAudio
                        );
                }


                remoteAudio.srcObject =
                    event.streams[0];


                remoteAudio
                    .play()
                    .then(() => {

                        writeLog(
                            "🔊 Assistant audio playing.",
                            "success"
                        );

                    })
                    .catch(error => {

                        writeLog(
                            "Browser blocked audio autoplay: " +
                            error.message,
                            "error"
                        );

                    });
            };


        /* =====================================================
           OFFER
           ===================================================== */

        status.textContent =
            "Creating connection...";


        writeLog(
            "Creating WebRTC offer..."
        );


        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        /* =====================================================
           ICE
           ===================================================== */

        writeLog(
            "Waiting for ICE gathering..."
        );


        await waitForIceGathering();


        writeLog(
            "ICE gathering complete.",
            "success"
        );


        /* =====================================================
           SEND OFFER
           ===================================================== */

        /*
         * IMPORTANT:
         *
         * This page is expected to be served by the SAME
         * FastAPI server:
         *
         * http://127.0.0.1:8000/
         *
         * Therefore we use "/offer".
         */

        const offerUrl =
            "/offer";


        writeLog(
            "Sending offer to " +
            offerUrl
        );


        const response =
            await fetch(
                offerUrl,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        sdp:
                            pc.localDescription.sdp,

                        type:
                            pc.localDescription.type

                    })

                }
            );


        if (!response.ok) {

            const body =
                await response.text();

            throw new Error(
                "Server returned HTTP " +
                response.status +
                ": " +
                body
            );
        }


        const answer =
            await response.json();


        writeLog(
            "Server answer received."
        );


        /* =====================================================
           SERVER ANSWER
           ===================================================== */

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                answer
            )
        );


        writeLog(
            "✅ Remote description set.",
            "success"
        );


        status.textContent =
            "🟢 Listening — speak now";


    } catch (error) {

        console.error(error);


        writeLog(
            "❌ ERROR: " +
            error.message,
            "error"
        );


        status.textContent =
            "❌ " +
            error.message;


        await stopVoiceAgent();
    }
}


/* =========================================================
   STOP
   ========================================================= */

async function stopVoiceAgent() {

    writeLog(
        "Stopping voice agent..."
    );


    stopTimer();

    stopMicMeter();


    recordDot.classList.remove(
        "active"
    );

    recordText.textContent =
        "Microphone off";


    /* =====================================================
       STOP MICROPHONE
       ===================================================== */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                try {
                    track.stop();
                } catch (_) {}

            });

        localStream = null;
    }


    /* =====================================================
       CLOSE PEER CONNECTION
       ===================================================== */

    if (pc) {

        try {
            pc.close();
        } catch (_) {}

        pc = null;
    }


    /* =====================================================
       REMOVE AUDIO
       ===================================================== */

    if (remoteAudio) {

        try {

            remoteAudio.pause();

            remoteAudio.srcObject = null;

            remoteAudio.remove();

        } catch (_) {}

        remoteAudio = null;
    }


    startButton.style.display =
        "inline-block";

    stopButton.style.display =
        "none";


    status.textContent =
        "Stopped";


    writeLog(
        "🛑 Voice agent stopped."
    );
}


/* =========================================================
   BUTTONS
   ========================================================= */

startButton.addEventListener(
    "click",
    startVoiceAgent
);


stopButton.addEventListener(
    "click",
    stopVoiceAgent
);


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (localStream) {

            localStream
                .getTracks()
                .forEach(track => {

                    try {
                        track.stop();
                    } catch (_) {}

                });
        }


        if (pc) {

            try {
                pc.close();
            } catch (_) {}
        }
    }
);

</script>

</body>
</html>
